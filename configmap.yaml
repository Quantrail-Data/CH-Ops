apiVersion: v1
kind: ConfigMap
metadata:
  name: chops-config
data:
  NODE_ENV: "production"
  PORT: "7720"

  # Where the database file lives. This directory is on the persistent disk.
  DB_PATH: "/app/data/chops.db"

  # Where export files are written. Deliberately NOT on the persistent disk.
  # See docs/deployment/kubernetes.md.
  EXPORT_DIR: "/app/exports"

  # Total size all export files may occupy. Must stay below the 8Gi limit set on
  # the exports volume in the StatefulSet, or Kubernetes evicts the pod when it
  # fills up, which takes the database down with it.
  EXPORT_MAX_TOTAL_BYTES: "6442450944"

  # Largest single export. 4Gi.
  EXPORT_MAX_JOB_BYTES: "4294967296"

  # The number of proxies in front of CHOps that add X-Forwarded-For. With the
  # ingress controller only, this is 1. Without it, all users share one rate
  # limit bucket, because every request comes from the ingress pod.
  # Add one for each other HTTP proxy, for example a cloud load balancer in
  # HTTP mode. Remove it if you do not use the Ingress.
  TRUST_PROXY: "1"

  # The address that users open. CHOps puts it in the links that set a password.
  # FRONTEND_LINK: "https://chops.example.com"
