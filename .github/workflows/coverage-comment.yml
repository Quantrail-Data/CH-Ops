name: Post Coverage Comment

# Runs after "Run Unit Tests" in the base repo's context, which is what gets us
# a write token on fork PRs. Only reads a markdown file out of an artifact:
# nothing from the PR is checked out or executed.
on:
  workflow_run:
    workflows: ["Run Unit Tests"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download coverage comment artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-comment
          path: ./artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Post or update the comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('./artifact/coverage-comment.md')) {
              core.info('No coverage report produced; nothing to post.');
              return;
            }
            if (!fs.existsSync('./artifact/pr-number.txt')) {
              core.info('No PR number recorded; nothing to post.');
              return;
            }

            const issue_number = Number(
              fs.readFileSync('./artifact/pr-number.txt', 'utf8').trim()
            );
            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              core.setFailed('Recorded PR number is not a positive integer.');
              return;
            }

            // Artifact comes from a job that may have run fork code. Data
            // only: posted verbatim as a comment body, never evaluated.
            const body = fs.readFileSync('./artifact/coverage-comment.md', 'utf8');
            const marker = '<!-- coverage-report-bot -->';

            const { owner, repo } = context.repo;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
