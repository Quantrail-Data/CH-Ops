name: Release (Docker)

# Manual trigger only. A person starts it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "Changelog for this release (shown in the GitHub release notes)"
        required: true
        type: string

# Only one release runs at a time.
concurrency:
  group: release-docker
  cancel-in-progress: false

env:
  IMAGE_GHCR: ghcr.io/quantrail-data/ch-ops
  # Your personal Docker Hub account. Change here only if you publish elsewhere.
  IMAGE_DOCKERHUB: quantrailadmin1/ch-ops

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the git tag and the GitHub release
      packages: write   # to push the image to GHCR

    steps:
      # Always build from the latest main branch.
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # so the tag check below can see all tags

      # Read the single source of truth: version.json.
      - name: Read version
        id: ver
        run: |
          VERSION=$(jq -r .version version.json)
          echo "Read version: $VERSION"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: version.json version '$VERSION' is not X.Y.Z" >&2
            exit 1
          fi
          echo "version=$VERSION"          >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}"      >> "$GITHUB_OUTPUT"
          echo "major_minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      # Safety: stop if this version was already released.
      - name: Check the tag does not exist
        run: |
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "ERROR: tag v${{ steps.ver.outputs.version }} already exists. Bump version.json first." >&2
            exit 1
          fi

      # Enable multi-architecture builds (amd64 and arm64).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Sign in to both registries.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build once, push to both registries, with four tag levels each.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE_GHCR }}:latest
            ${{ env.IMAGE_GHCR }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_GHCR }}:${{ steps.ver.outputs.major_minor }}
            ${{ env.IMAGE_GHCR }}:${{ steps.ver.outputs.major }}
            ${{ env.IMAGE_DOCKERHUB }}:latest
            ${{ env.IMAGE_DOCKERHUB }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_DOCKERHUB }}:${{ steps.ver.outputs.major_minor }}
            ${{ env.IMAGE_DOCKERHUB }}:${{ steps.ver.outputs.major }}

      # Create the git tag and the GitHub release, only after the push succeeds.
      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.ver.outputs.version }}
          body: ${{ github.event.inputs.changelog }}
          generate_release_notes: true
          draft: false
          prerelease: false