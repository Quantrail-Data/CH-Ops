name: Run E2E Tests

on:
  push:
    branches: [ main, testing ]
  pull_request:
    branches: [ main, testing ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      # Frozen: we have a patched dep and ten overrides, so an unfrozen install
      # can resolve to a different tree than the one we ship.
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Only chromium is exercised by playwright.config.js, so that's all we
      # install here - keeps the step fast and the runner image small.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # gen-e2e-env writes a throwaway super-admin login + encryption secret
      # (see scripts/gen-e2e-env.mjs), so no real secrets are needed here.
      # webServer in playwright.config.js starts backend + frontend itself.
      - name: Run Playwright E2E tests
        run: bun run test:e2e
        env:
          DEBUG: pw:webserver

      # Turns playwright-report/results.json (the json reporter output, see
      # playwright.config.js) into a pass/fail table in the job summary, so a
      # failure is visible without downloading the html report artifact.
      - name: Write E2E report to job summary
        if: always()
        run: node scripts/e2e-report-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
