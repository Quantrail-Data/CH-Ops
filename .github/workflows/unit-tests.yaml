name: Run Unit Tests

on:
  push:
    branches: [ main, testing ]
  pull_request:
    branches: [ main, testing ]

# Fork PRs get a read-only token whatever we ask for here, so the coverage
# comment lives in coverage-comment.yml instead.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # Job-scoped, not workflow-scoped. The build job must not see these:
    # --env=inline would bake them into the binary.
    env:
      # Dummy values for unit tests only. Not real credentials.
      SUPER_ADMIN_1: test-admin
      SUPER_ADMIN_1_PASSWORD: test-password-123
      SESSION_SECRET: test-session-secret
      SUPER_ADMIN_1_EMAIL: abc@gmail.com

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      # Frozen: we have a patched dep and ten overrides, so an unfrozen install
      # can resolve to a different tree than the one we ship.
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Fails the build if any console.* call looks like it could print a
      # password, token, API key, or a raw error/response object that might
      # carry one. See scripts/check-sensitive-logging.mjs for the rules.
      - name: Check for sensitive data in console logging
        run: bun run check:sensitive-logging

      - name: Run Tests with Coverage
        run: set -o pipefail && bun run test:coverage 2>&1

      - name: Run Lint
        run: bun run lint
        continue-on-error: true

      # Built here, posted by coverage-comment.yml. This job can be running
      # fork code, so it stays read-only.
      - name: Generate coverage report
        if: always() && github.event_name == 'pull_request'
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/coverage-report.mjs > coverage-comment.md

      - name: Save PR number alongside the report
        if: always() && github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload coverage comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-comment
          path: |
            coverage-comment.md
            pr-number.txt
          retention-days: 3

  build:
    name: Verify Binary Build
    runs-on: ubuntu-latest

    # No env: here. Anything set gets inlined into the binary and this stops
    # being a check of what actually ships.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Catches issues release.yml can only surface on a tag push (e.g. a new
      # dependency whose bundler-time import - like @opentelemetry/api pulled
      # in by @mistralai/mistralai - can't be resolved), before it reaches main.
      # Uses the same standalone build script the release pipeline publishes,
      # so this is a build-only check of the exact thing that ships.
      - name: Compile binary (build-only check, not published)
        run: bun run build:standalone:linux

      # Linking isn't running. Boot it and see if it answers.
      - name: Smoke test the binary
        env:
          SUPER_ADMIN_1: smoke-admin
          SUPER_ADMIN_1_PASSWORD: smoke-password-123
          SUPER_ADMIN_1_EMAIL: smoke@example.com
          SESSION_SECRET: smoke-only-not-a-real-secret-0123456789
          PORT: 3999
        run: |
          ./chops-linux-x64 > smoke.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3999/api/health" -o health.json; then
              echo "up after ${i}s:"; cat health.json; echo
              kill "$pid" 2>/dev/null || true
              exit 0
            fi
            # died on startup, no point waiting out the loop
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "exited before serving:"; cat smoke.log; exit 1
            fi
            sleep 1
          done
          echo "timed out waiting for /api/health:"; cat smoke.log
          kill "$pid" 2>/dev/null || true
          exit 1
