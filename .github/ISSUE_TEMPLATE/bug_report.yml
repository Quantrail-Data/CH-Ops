name: Bug report
description: Something in CHOps is not working the way it should
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **If this is a security vulnerability, stop and read
        [SECURITY.md](https://github.com/Quantrail-Data/CH-Ops/blob/main/SECURITY.md)
        instead.** Please do not describe it here.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did CHOps do, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Overview > Queries
        2. Sort by Memory
        3. ...
    validations:
      required: true

  - type: input
    id: chops-version
    attributes:
      label: CHOps version
      description: Shown in the UI, or from `GET /api/version`
      placeholder: "26.3-0.1.6"
    validations:
      required: true

  - type: input
    id: clickhouse-version
    attributes:
      label: ClickHouse® server version
      placeholder: "25.8.1"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is ClickHouse® deployed?
      options:
        - Bare metal or VM
        - Docker or Docker Compose
        - Kubernetes with the Altinity® operator (AKOC)
        - Kubernetes with the official ClickHouse® operator (OCKO)
        - Kubernetes with no operator
        - ClickHouse® Cloud or another managed service
        - Other
    validations:
      required: true

  - type: dropdown
    id: chops-deployment
    attributes:
      label: How is CHOps running?
      options:
        - Prebuilt binary from Releases
        - Docker image
        - From source with `bun run dev`
        - Built my own binary
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Redact anything sensitive first: hostnames, usernames, tokens.
        Output will be automatically formatted as shell code.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Visual Evidence
      description: Drag and drop or paste images directly into this area.
    
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am on the latest CHOps release, or have explained why not
          required: true
        - label: I have removed credentials and other sensitive data from anything I pasted
          required: true