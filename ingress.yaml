apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chops
  annotations:
    # Export downloads can be gigabytes. Without these three the proxy either
    # rejects the request or gives up partway through a large download.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: chops.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chops
                port:
                  number: 3000
