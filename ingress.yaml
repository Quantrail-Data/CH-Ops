apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chops
  annotations:
    # These annotations are for the ingress-nginx controller. For another
    # controller, set the same three things in its own way.
    # Export downloads can be gigabytes. Without these three the proxy either
    # rejects the request or gives up partway through a large download.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  # Use HTTPS. Users send passwords to CHOps. With cert-manager, add the
  # annotation cert-manager.io/cluster-issuer: <your issuer> and uncomment this.
  # tls:
  #   - hosts:
  #       - chops.example.com
  #     secretName: chops-tls
  rules:
    - host: chops.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chops
                port:
                  number: 7720
