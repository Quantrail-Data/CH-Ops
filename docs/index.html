<!-- Entry point for the Docsify documentation system, loading and rendering static markdown user guides. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHOps Documentation</title>
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css" /> -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&family=Atkinson+Hyperlegible+Mono:wght@400;500;600&family=B612:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link href="./style.css" rel="stylesheet" />
    <style>
      /* The docs use the Midnight theme of the app (src/frontend/styles/global.css):
         the same fonts, colors and tokens, in the light and the dark theme. */
      :root,
      body:not(.dark-mode) {
        --bg-page: #F4F5F8;
        --bg-surface: #FFFFFF;
        --bg-raised: #FFFFFF;
        --bg-sunken: #ECEEF2;
        --bg-hover: #F0F2F6;
        --border-default: #E2E5EB;
        --border-strong: #CDD2DC;
        --text-primary: #0F1320;
        --text-secondary: #384154;
        --text-muted: #5B6478;
        --accent: #4F46E5;
        --accent-hover: #4338CA;
        --accent-soft: rgba(79, 70, 229, 0.08);
        --th-bg: #F8F9FB;
        --selection-bg: rgba(79, 70, 229, 0.3);
        --code-keyword: #6D28D9;
        --code-string: #13773A;
        --code-number: #0369A1;
        --code-function: #1D4ED8;
        --code-operator: #C02626;
        --code-variable: #8C5405;
        --code-comment: #5B6478;
        --theme-color: var(--accent);
        --sidebar-width: 260px;
        --base-font-family: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", sans-serif;
        --heading-font-family: var(--base-font-family);
        --code-font-family: "Atkinson Hyperlegible Mono", ui-monospace, monospace;
        --base-font-size: 16px;
      }

      body.dark-mode {
        --bg-page: #070B17;
        --bg-surface: #0D1324;
        --bg-raised: #131A2E;
        --bg-sunken: #0A0F1D;
        --bg-hover: #161E35;
        --border-default: #1E2740;
        --border-strong: #2A3556;
        --text-primary: #ECEFF4;
        --text-secondary: #B6BECD;
        --text-muted: #8C95A8;
        --accent: #9590FF;
        --accent-hover: #ABA7FF;
        --accent-soft: rgba(149, 144, 255, 0.12);
        --th-bg: #131A2E;
        --selection-bg: rgba(149, 144, 255, 0.5);
        --code-keyword: #B8B5FF;
        --code-string: #3FD69A;
        --code-number: #4CC9F0;
        --code-function: #7DB4FF;
        --code-operator: #FF7A7A;
        --code-variable: #F5B83D;
        --code-comment: #8C95A8;
        --theme-color: var(--accent);
      }

      /* On body, so they take the values of the theme on body (a value set on
         :root would keep the light theme values in the dark theme). */
      body {
        /* The Docsify theme (style.css) reads these. */
        --base-background-color: var(--bg-page);
        --base-color: var(--text-secondary);
        --heading-color: var(--text-primary);
        --strong-color: var(--text-primary);
        --hr-border: 1px solid var(--border-default);
        --selection-color: var(--selection-bg);
        --mark-background: var(--accent-soft);
        --blockquote-background: var(--accent-soft);
        --code-theme-background: var(--bg-sunken);
        --code-inline-color: var(--text-primary);
        --code-theme-text: var(--text-primary);
        --kbd-background: var(--bg-sunken);
        --notice-background: var(--bg-sunken);
        --table-cell-border-color: var(--border-default);
        --table-row-odd-background: var(--bg-surface);
        --sidebar-background: var(--bg-surface);
        --sidebar-nav-link-color: var(--text-secondary);
        --sidebar-nav-link-color--active: var(--accent);
        --navbar-menu-background: var(--bg-surface);
        --search-result-heading-color: var(--text-primary);
        --search-result-item-color: var(--text-secondary);
        --search-input-background-color: var(--bg-sunken);
        --search-input-color: var(--text-primary);
      }

      body {
        font-family: var(--base-font-family);
        line-height: 1.65;
        background: var(--bg-page);
        color: var(--text-primary);
      }

      ::selection {
        background: var(--selection-bg);
        color: var(--text-primary);
      }

      /* Sidebar: a solid surface with a border, as in the app. */
      .sidebar {
        background: var(--bg-surface);
        border-right: 1px solid var(--border-default);
      }

      .sidebar-nav li a {
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-secondary);
      }

      .sidebar-nav li a:hover {
        color: var(--text-primary);
      }

      .sidebar-nav li.active > a,
      .sidebar-nav a.active {
        color: var(--accent);
        font-weight: 600;
      }

      .sidebar-nav li.folder {
        color: var(--text-primary);
        font-weight: 600;
      }

      .app-name-link {
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-primary);
      }

      .sidebar .search {
        border-bottom: 1px solid var(--border-default);
      }

      .sidebar .search .input-wrap {
        background: var(--bg-sunken);
        border: 1px solid var(--border-default);
        border-radius: 8px;
      }

      .sidebar .search input[type="search"] {
        color: var(--text-primary);
        background-color: transparent;
      }

      .sidebar .search input[type="search"]::placeholder {
        color: var(--text-muted);
      }

      .search .matching-post {
        border-bottom: 1px solid var(--border-default);
      }

      .search .matching-post:hover {
        background: var(--bg-hover);
      }

      .sidebar-toggle .sidebar-toggle-button {
        background: var(--accent);
        color: #FFFFFF;
      }

      /* Page text. */
      .markdown-section {
        max-width: 860px;
        font-size: 1rem;
        line-height: 1.7;
        color: var(--text-secondary);
      }

      .markdown-section p,
      .markdown-section li {
        font-size: 1rem;
        color: var(--text-secondary);
      }

      .markdown-section h1,
      .markdown-section h2,
      .markdown-section h3,
      .markdown-section h4,
      .markdown-section strong {
        color: var(--text-primary);
      }

      .markdown-section h1,
      .markdown-section h2,
      .markdown-section h3 {
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .markdown-section h2 {
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border-default);
      }

      .markdown-section a {
        color: var(--accent);
        text-decoration: none;
      }

      .markdown-section a:hover {
        color: var(--accent-hover);
        text-decoration: underline;
      }

      .markdown-section hr {
        border-color: var(--border-default);
      }

      .markdown-section blockquote {
        border-left: 3px solid var(--accent);
        color: var(--text-secondary);
        background: var(--accent-soft);
        padding: 12px 16px;
        border-radius: 0 8px 8px 0;
      }

      /* Code. */
      .markdown-section code {
        font-family: var(--code-font-family);
        font-size: 0.875em;
      }

      .markdown-section code:not([class*="lang-"]) {
        background: var(--bg-sunken);
        color: var(--text-primary);
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid var(--border-default);
      }

      .markdown-section pre {
        background: var(--bg-sunken);
        border: 1px solid var(--border-default);
        border-radius: 8px;
      }

      .markdown-section pre code {
        color: var(--text-primary);
        background: none;
        border: none;
      }

      .token.comment { color: var(--code-comment); }
      .token.keyword { color: var(--code-keyword); font-weight: 600; }
      .token.string { color: var(--code-string); }
      .token.number { color: var(--code-number); }
      .token.function { color: var(--code-function); }
      .token.operator { color: var(--code-operator); }
      .token.variable { color: var(--code-variable); }

      /* Tables: the data font of the app (B612), a raised header row. */
      .markdown-section table {
        font-size: 0.9rem;
        border: 1px solid var(--border-default);
        border-radius: 8px;
      }

      .markdown-section th,
      .markdown-section td {
        font-family: "B612", "Atkinson Hyperlegible Next", sans-serif;
        border-color: var(--border-default);
        color: var(--text-secondary);
      }

      .markdown-section table th {
        background: var(--th-bg);
        color: var(--text-primary);
      }

      .markdown-section tbody tr,
      .markdown-section tbody tr:nth-child(odd),
      .markdown-section tbody tr:nth-child(even) {
        background: var(--bg-surface);
      }

      .markdown-section tbody tr:hover td {
        background: var(--bg-hover);
      }

      /* Theme toggle: the icon button of the app. */
      .theme-toggle {
        position: fixed;
        top: 12px;
        right: 16px;
        z-index: 100;
        width: 32px;
        height: 32px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        background: var(--bg-surface);
        border: 1px solid var(--border-strong);
        color: var(--text-primary);
        transition: background 0.15s ease;
      }

      .theme-toggle:hover {
        background: var(--bg-hover);
      }

      .theme-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Caret indicators for collapsible sidebar sections.
       Docsify renders parent sections as <li class="folder">Label<ul>...</ul></li>
       with the label as a bare text node (no <a>/<p>). The collapse plugin adds
       the class "collapse" when the section is currently collapsed and removes it
       when expanded. We draw the caret as a ::before on the folder <li> and flip
       it based on the presence of the "collapse" class. */
      .sidebar-nav li.folder {
        position: relative;
        padding-left: 1.1em;
        cursor: pointer;
        list-style: none;
      }

      .sidebar-nav li.folder::before {
        content: "\203A"; /* › */
        position: absolute;
        left: 0.15em;
        top: 0.18em;
        font-size: 1.15em;
        line-height: 1.2;
        opacity: 0.6;
        transition: transform 0.15s ease;
        transform-origin: center;
      }

      /* Expanded folders carry the "open" class -> caret points down.
       Default (collapsed, no "open") stays pointing right. This matches the
       plugin's real state classes: "open folder" when expanded, plain "folder"
       or "folder collapse" when not. */
      .sidebar-nav li.folder.open::before {
        transform: rotate(90deg);
      }

      /* Nested folders sit one level in; nudge their caret to align */
      .sidebar-nav li.folder .folder {
        padding-left: 1.1em;
      }
    </style>
  </head>

  <body>
    <button
      class="theme-toggle"
      onclick="toggleDocsTheme()"
      title="Toggle dark/light mode"
      id="docs-theme-btn"
    >
      &#9790;
    </button>
    <div id="app"></div>
    <script>
      var isDark = document.body.classList.contains("dark-mode");
      function applyDocsTheme(dark) {
        document.body.classList.toggle("dark-mode", dark);
        var btn = document.getElementById("docs-theme-btn");
        btn.innerHTML = dark ? "&#9728;" : "&#9790;";
        const imgLogo = document.querySelector("img");
        if (imgLogo) {
          imgLogo.src = dark ? "./chops-light.svg" : "./chops-dark.svg";
        }
      }
      function toggleDocsTheme() {
        var isDark = document.body.classList.contains("dark-mode");
        applyDocsTheme(!isDark);
        try {
          localStorage.setItem("chops_docs_theme", isDark ? "light" : "dark");
          
        } catch {}
      }
      (function () {
        var saved = null;
        try {
          saved =
            localStorage.getItem("chops_docs_theme") ||
            localStorage.getItem("chops_theme");
        } catch {}
        applyDocsTheme(
          saved === "dark" ||
            (!saved &&
              window.matchMedia("(prefers-color-scheme: dark)").matches),
        );
      })();
      window.$docsify = {
        name: " ",
        repo: "",
        basePath: "/docs/",
        relativePath: true,
        loadSidebar: true,
        subMaxLevel: 3,
        sidebarDisplayLevel: 1,
        auto2top: true,
        search: {
          placeholder: "Search docs",
          noData: "No results found.",
          paths: "auto",
        },
        plugins: [
          function (hook) {
            hook.doneEach(function () {
              const anchorTag = document.querySelector(".app-name-link");

              if (anchorTag && !anchorTag.querySelector(".logo-img")) {
                const imgLogo = document.createElement("img");
                imgLogo.className = "logo-img";
                var isDark = document.body.classList.contains("dark-mode");
                imgLogo.src = isDark ? "./chops-light.svg" : "./chops-dark.svg"; 
                anchorTag.prepend(imgLogo);
              }
            });
          },
        ],
      };

      
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1/dist/docsify-sidebar-collapse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  </body>
</html>
