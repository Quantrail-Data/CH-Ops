services:
  chops:
    build: .
    image: chops:latest
    container_name: chops
    restart: unless-stopped
    ports:
      - "3000:3000"
    # The whole file, not a hand-listed subset. Enumerating dropped 21 vars
    # including every SMTP_* one and SUPER_ADMIN_1_EMAIL, which loadEnv requires.
    env_file:
      - .env
    environment:
      # Deployment facts rather than user configuration, so they stay here and
      # override anything in .env.
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - chops-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  chops-data:
    driver: local