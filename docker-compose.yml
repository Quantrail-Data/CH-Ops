services:
  chops:
    build: .
    image: chops:latest
    container_name: chops
    restart: unless-stopped
    ports:
      - "7720:7720"
    # Read the whole .env file, so that no variable is left out.
    env_file:
      - .env
    environment:
      # Deployment facts rather than user configuration, so they stay here and
      # override anything in .env.
      - NODE_ENV=production
      - PORT=7720
    volumes:
      - chops-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7720/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  chops-data:
    driver: local